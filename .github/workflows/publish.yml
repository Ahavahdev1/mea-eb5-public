name: Publish evaluated report

on:
  workflow_dispatch:
    inputs:
      grade_repository:
        description: "Owner/repository containing the private grade run"
        required: true
      grade_run_id:
        description: "GitHub Actions run ID containing evaluated bundles"
        required: true

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.12"

      - name: Download evaluated bundles only
        uses: actions/download-artifact@cc203385981b70ca67e1cc39263f7ee061dd0dc6 # v4.1.9
        with:
          repository: ${{ inputs.grade_repository }}
          run-id: ${{ inputs.grade_run_id }}
          github-token: ${{ secrets.GRADE_READ_TOKEN }}
          pattern: evaluated-*
          merge-multiple: true
          path: evaluated

      - name: Build static report without executing submitted content
        run: python scripts/build_report.py evaluated reports

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: reports/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed371e51d357ecf03fc # v4.0.5
