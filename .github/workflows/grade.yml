name: Private grading

on:
  workflow_dispatch:
    inputs:
      source_repository:
        description: "Owner/repository containing the benchmark run"
        required: true
      source_run_id:
        description: "GitHub Actions run ID containing attempt artifacts"
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: grade-${{ inputs.source_repository }}-${{ inputs.source_run_id }}
  cancel-in-progress: false

jobs:
  grade:
    environment: private-grader
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@f677139bbe7f9c59b41e40162b753c062f5d49a3 # v5.2.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install private evaluator
        run: python -m pip install --disable-pip-version-check '.[dev]'

      - name: Build private grader before receiving untrusted artifacts
        run: |
          docker build --file Dockerfile.grader --tag "mea-eb5-private-grader:${GITHUB_SHA}" .
          docker image inspect --format '{{.Id}}' "mea-eb5-private-grader:${GITHUB_SHA}" \
            > grader-image-id.txt

      - name: Download attempt archives from the public runner
        uses: actions/download-artifact@v4
        with:
          repository: ${{ inputs.source_repository }}
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true
          path: incoming

      - name: Verify, extract, and grade every run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs evaluated isolated-runs
          
          # Processa estritamente os artefatos reais baixados
          shopt -s nullglob
          for item in incoming/*; do
            if [ -d "$item" ]; then
              name=$(basename "$item")
              run_id=$(echo "$name" | sed 's/^attempt-//')
              echo "Processando diretório de tentativa real: $item (run_id: $run_id)"
              mkdir -p "runs/$run_id"
              cp -r "$item"/* "runs/$run_id/" || true
            elif [ -f "$item" ] && [[ "$item" == *.tar.gz ]]; then
              python scripts/extract_attempt.py "$item" runs || true
            fi
          done

          echo "Conteúdo extraído em runs/:"
          ls -la runs/

          # Obriga o container do Grader a avaliar os arquivos reais
          for manifest in runs/*/manifest.json; do
            [ -f "$manifest" ] || continue
            run_id=$(basename "$(dirname "$manifest")")
            echo "Avaliando estritamente a evidência real: $run_id"
            
            mkdir -p "isolated-runs/$run_id" "evaluated/$run_id"
            cp -r "runs/$run_id"/* "isolated-runs/$run_id/"
            
            docker run --rm \
              --network none \
              --read-only \
              --tmpfs /tmp:rw,noexec,nosuid,size=256m \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              --pids-limit 256 \
              --cpus 2 \
              --memory 4g \
              --user "$(id -u):$(id -g)" \
              --volume "$PWD/isolated-runs:/runs:rw" \
              "mea-eb5-private-grader:${GITHUB_SHA}" \
              grade "$run_id" --runs-dir /runs --challenges-dir /app/challenges
              
            cp "isolated-runs/$run_id/manifest.json" "evaluated/$run_id/manifest.json"
            cp "isolated-runs/$run_id/score.json" "evaluated/$run_id/score.json"
          done
          
          echo "Conteúdo final de evaluated/:"
          ls -la evaluated/

      - name: Upload evaluated public-safe bundle
        uses: actions/upload-artifact@50769540e7f4bd5e21e526ee35c689e35e0d6874 # v4.4.0
        with:
          name: evaluated-${{ inputs.source_run_id }}
          path: evaluated/
          if-no-files-found: error
          retention-days: 90
